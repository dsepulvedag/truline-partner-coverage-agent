<!doctype html>
<html><head><meta charset="utf-8"><title>Truline title</title><link rel="stylesheet" href="card.css">
<style>
.bands { display: grid; grid-template-columns: 50fr 250fr 200fr; gap: 10px; margin-top: 48px; height: 150px; }
.band { border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; }
.b1 { background: #1d6fa5; animation-delay: 1.4s; }
.b2 { background: #2a557c; animation-delay: 3.0s; }
.b3 { background: #3a2329; border: 2px dashed var(--clay); animation-delay: 4.6s; }
.band .n { font-size: 40px; font-weight: 700; }
.band .t { font-size: 19px; color: #dbe6f1; }
.b3 .n { color: var(--clay); }
.punch { font-size: 44px; font-weight: 700; margin-top: 40px; animation-delay: 7.6s; }
</style></head>
<body><div class="wrap">
  <div class="eyebrow fade">Truline partner coverage</div>
  <h1 class="fade" style="animation-delay:.3s">500 partners · 64 partner account managers</h1>
  <div class="bands">
    <div class="band b1 fade"><div class="n">50</div><div class="t">dedicated PAM</div></div>
    <div class="band b2 fade"><div class="n">250</div><div class="t">share 14 PAMs</div></div>
    <div class="band b3 fade"><div class="n">200</div><div class="t">nobody</div></div>
  </div>
  <div class="punch fade">We're changing that.</div>
  <div class="foot"><span class="dot"></span>Snowflake <span class="dot clay"></span>Claude</div>
</div></body></html>
