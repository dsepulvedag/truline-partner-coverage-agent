<!doctype html>
<html><head><meta charset="utf-8"><title>Truline close</title><link rel="stylesheet" href="card.css">
<style>
.lines { margin-top: 40px; display: grid; gap: 18px; }
.l { font-size: 40px; font-weight: 600; }
.l span { color: var(--snow); }
.l:nth-child(1) { animation-delay: .2s; } .l:nth-child(2) { animation-delay: 1.2s; } .l:nth-child(3) { animation-delay: 2.2s; }
</style></head>
<body><div class="wrap">
  <div class="eyebrow fade">Truline Partner Coverage Agent</div>
  <div class="lines">
    <div class="l fade"><span>One engine</span> for all 500 partners</div>
    <div class="l fade"><span>Every number</span> cited</div>
    <div class="l fade"><span>Every action</span> audited</div>
  </div>
  <div class="foot"><span class="dot"></span>Built on Snowflake <span class="dot clay"></span>with Claude</div>
</div></body></html>
